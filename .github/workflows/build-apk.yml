name: Build FlyBrain APK V1.00

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================

      - name: Descargar proyecto
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. PYTHON 3.11
      # ============================================================

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'


      # ============================================================
      # 5. GRADLE 8.9
      # ============================================================

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. COMPROBAR ZIP V1.00
      # ============================================================

      - name: Comprobar ZIP V1.00
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPROBANDO ZIP FLYBRAIN V1.00"
          echo "========================================"

          test -f "FlyBrainV100_GitHub_Actions.zip"

          unzip -t "FlyBrainV100_GitHub_Actions.zip" >/dev/null

          ls -lh "FlyBrainV100_GitHub_Actions.zip"

          echo "ZIP V1.00 CORRECTO"


      # ============================================================
      # 7. DESCOMPRIMIR PROYECTO V1.00
      # ============================================================

      - name: Descomprimir proyecto V1.00
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DESCOMPRIMIENDO PROYECTO V1.00"
          echo "========================================"

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q "FlyBrainV100_GitHub_Actions.zip" -d proyecto

          echo "Comprobando estructura..."

          test -f "proyecto/settings.gradle.kts"
          test -f "proyecto/build.gradle.kts"
          test -f "proyecto/gradle.properties"

          test -f "proyecto/tools/build_connectome.py"

          test -f "proyecto/app/build.gradle.kts"

          test -f "proyecto/app/src/main/AndroidManifest.xml"

          test -f "proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt"

          test -f "proyecto/app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          echo "ESTRUCTURA V1.00 CORRECTA"


      # ============================================================
      # 8. INSTALAR DEPENDENCIAS PYTHON
      # ============================================================

      - name: Instalar dependencias del extractor
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO DEPENDENCIAS PYTHON"
          echo "========================================"

          python -m pip install --upgrade pip

          python -m pip install numpy pandas pyarrow

          echo "DEPENDENCIAS PYTHON INSTALADAS"


      # ============================================================
      # 9. VALIDAR SCRIPT MALECNS
      # ============================================================

      - name: Validar extractor MaleCNS V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO BUILD_CONNECTOME.PY"
          echo "========================================"

          python -m py_compile tools/build_connectome.py

          echo "BUILD_CONNECTOME.PY CORRECTO"


      # ============================================================
      # 10. GENERAR REDUCCIÓN MALECNS V1.00
      # ============================================================

      - name: Generar reducción real MaleCNS V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GENERANDO REDUCCION REAL MALECNS"
          echo "VERSION V1.00"
          echo "OBJETIVO: 16.669 NEURONAS"
          echo "========================================"

          python tools/build_connectome.py

          echo "========================================"
          echo "COMPROBANDO ARCHIVOS GENERADOS"
          echo "========================================"

          test -f "app/src/main/res/raw/malecns_reduced.bin"

          test -f "app/src/main/res/raw/malecns_reduced_report.json"

          test -f "app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          grep -Fq '"neurons_retained": 16669' \
            "app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'functional_bridge_candidates_retained' \
            "app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'retained_sensor_to_desc_edges' \
            "app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'retained_desc_to_motor_edges' \
            "app/src/main/res/raw/malecns_reduced_report.json"

          echo "ARCHIVOS MALECNS V1.00 GENERADOS Y VERIFICADOS"

          ls -lh "app/src/main/res/raw/malecns_reduced.bin"


      # ============================================================
      # 11. VERIFICAR ROLES MOTORES
      # ============================================================

      - name: Verificar roles motores V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO ROLES MOTORES V1.00"
          echo "========================================"

          META="app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          grep -Fq 'NEURONS = 16669' "$META"

          grep -Fq 'MOTOR_LEG = 1' "$META"

          grep -Fq 'MOTOR_WING = 2' "$META"

          grep -Fq 'MOTOR_HALTERE = 3' "$META"

          grep -Fq 'MOTOR_NECK = 4' "$META"

          grep -Fq 'MOTOR_ABDOMEN = 5' "$META"

          grep -Fq 'MOTOR_JUMP = 6' "$META"

          grep -Fq 'MOTOR_OTHER = 7' "$META"

          echo "ROLES MOTORES V1.00 CORRECTOS"


      # ============================================================
      # 12. VERIFICAR ROLES DESCENDENTES
      # ============================================================

      - name: Verificar roles descendentes V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO ROLES DESCENDENTES"
          echo "========================================"

          REPORT="app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'descending_role_counts' "$REPORT"

          grep -Fq 'descending_role_definition' "$REPORT"

          echo "ROLES DESCENDENTES V1.00 CORRECTOS"


      # ============================================================
      # 13. VERIFICAR TRAZA SINAPTICA
      # ============================================================

      - name: Verificar integración sináptica V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO TRAZA SINAPTICA V1.00"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'synTrace' "$MAIN"

          grep -Fq 'synDecay' "$MAIN"

          echo "TRAZA SINAPTICA V1.00 CORRECTA"


      # ============================================================
      # 14. VERIFICAR DIAGNÓSTICO SENSORIAL
      # ============================================================

      - name: Verificar diagnóstico sensorial V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO DIAGNOSTICO SENSORIAL"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'visualRateDisplay' "$MAIN"

          grep -Fq 'olfactoryRateDisplay' "$MAIN"

          grep -Fq 'gustatoryRateDisplay' "$MAIN"

          grep -Fq 'mechanosensoryRateDisplay' "$MAIN"

          echo "DIAGNOSTICO SENSORIAL CORRECTO"


      # ============================================================
      # 15. VERIFICAR DIAGNÓSTICO CENTRAL / DESCENDENTE / MOTOR
      # ============================================================

      - name: Verificar diagnóstico neural V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO DIAGNOSTICO NEURAL V1.00"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          # CENTRAL

          grep -Fq 'centralRateDisplay' "$MAIN"

          # DESCENDENTES

          grep -Fq 'descendingRateDisplay' "$MAIN"

          # ASCENDENTES

          grep -Fq 'ascendingRateDisplay' "$MAIN"

          # MOTOR / VNC

          grep -Fq 'motorRateDisplay' "$MAIN"

          # LOCOMOCION

          grep -Fq 'stableLocomotion' "$MAIN"

          grep -Fq 'motorLocomotion' "$MAIN"

          echo "DIAGNOSTICO NEURAL V1.00 CORRECTO"


      # ============================================================
      # 16. VERIFICAR SELECCIÓN DE ACCIONES
      # ============================================================

      - name: Verificar selección de acciones V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO SELECCION DE ACCIONES V1.00"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          # --------------------------------------------------------
          # APROXIMACION
          # --------------------------------------------------------

          grep -Fq 'approachAction' "$MAIN"

          # --------------------------------------------------------
          # ESCAPE
          # --------------------------------------------------------

          grep -Fq 'escapeAction' "$MAIN"

          # --------------------------------------------------------
          # ORIENTACION
          # --------------------------------------------------------

          grep -Fq 'orientAction' "$MAIN"

          # --------------------------------------------------------
          # EXPLORACION
          # --------------------------------------------------------

          grep -Fq 'exploreAction' "$MAIN"

          # --------------------------------------------------------
          # FRENADO
          # --------------------------------------------------------

          grep -Fq 'brakeAction' "$MAIN"

          # --------------------------------------------------------
          # GIRO IZQUIERDA / DERECHA
          # --------------------------------------------------------

          grep -Fq 'turnLeftAction' "$MAIN"

          grep -Fq 'turnRightAction' "$MAIN"

          echo "SELECCION DE ACCIONES V1.00 CORRECTA"


      # ============================================================
      # 17. VERIFICAR PROYECTO V1.00
      # ============================================================

      - name: Verificar proyecto V1.00
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO PROYECTO FLYBRAIN V1.00"
          echo "========================================"

          APP_GRADLE="proyecto/app/build.gradle.kts"
          MAIN="proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt"
          META="proyecto/app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"
          REPORT="proyecto/app/src/main/res/raw/malecns_reduced_report.json"

          test -f "$APP_GRADLE"
          test -f "$MAIN"
          test -f "$META"
          test -f "proyecto/app/src/main/res/raw/malecns_reduced.bin"
          test -f "$REPORT"

          # --------------------------------------------------------
          # VERSION
          # --------------------------------------------------------

          grep -Fq 'versionCode = 100' "$APP_GRADLE"

          grep -Fq 'versionName = "1.00"' "$APP_GRADLE"

          grep -Fq 'FLYBRAIN V1.00' "$MAIN"

          # --------------------------------------------------------
          # NEURONAS
          # --------------------------------------------------------

          grep -Fq 'NEURONS = 16669' "$META"

          grep -Fq '"neurons_retained": 16669' "$REPORT"

          # --------------------------------------------------------
          # FORMATO BINARIO
          # --------------------------------------------------------

          grep -Fq 'FBC100' "$MAIN"

          # --------------------------------------------------------
          # ESTADO LOCOMOTOR
          # --------------------------------------------------------

          grep -Fq 'locomotorDrive' "$MAIN"

          grep -Fq 'locomotorPhase' "$MAIN"

          grep -Fq 'motorActivityMemory' "$MAIN"

          # --------------------------------------------------------
          # ROLES DESCENDENTES
          # --------------------------------------------------------

          grep -Fq 'descendingRole' "$MAIN"

          # --------------------------------------------------------
          # TRAZA SINAPTICA
          # --------------------------------------------------------

          grep -Fq 'synTrace' "$MAIN"

          # --------------------------------------------------------
          # DIAGNOSTICO SENSORIAL
          # --------------------------------------------------------

          grep -Fq 'visualRateDisplay' "$MAIN"

          grep -Fq 'olfactoryRateDisplay' "$MAIN"

          grep -Fq 'gustatoryRateDisplay' "$MAIN"

          grep -Fq 'mechanosensoryRateDisplay' "$MAIN"

          # --------------------------------------------------------
          # DIAGNOSTICO NEURAL
          # --------------------------------------------------------

          grep -Fq 'centralRateDisplay' "$MAIN"

          grep -Fq 'descendingRateDisplay' "$MAIN"

          grep -Fq 'ascendingRateDisplay' "$MAIN"

          grep -Fq 'motorRateDisplay' "$MAIN"

          # --------------------------------------------------------
          # LOCOMOCION
          # --------------------------------------------------------

          grep -Fq 'stableLocomotion' "$MAIN"

          grep -Fq 'motorLocomotion' "$MAIN"

          # --------------------------------------------------------
          # SELECCION DE ACCIONES
          # --------------------------------------------------------

          grep -Fq 'approachAction' "$MAIN"

          grep -Fq 'escapeAction' "$MAIN"

          grep -Fq 'orientAction' "$MAIN"

          grep -Fq 'exploreAction' "$MAIN"

          grep -Fq 'brakeAction' "$MAIN"

          grep -Fq 'turnLeftAction' "$MAIN"

          grep -Fq 'turnRightAction' "$MAIN"

          echo "========================================"
          echo "PROYECTO V1.00 VALIDADO"
          echo "========================================"

          echo "Version: 1.00"
          echo "VersionCode: 100"
          echo "Neuronas: 16.669"
          echo "Formato binario: FBC100"
          echo "MaleCNS: OK"
          echo "Functional bridge selection: OK"
          echo "VNC motor output: OK"
          echo "Descending roles: OK"
          echo "Neural diagnostic layer: OK"
          echo "Synaptic temporal traces: OK"
          echo "Action selection: OK"


      # ============================================================
      # 18. COMPILAR APK
      # ============================================================

      - name: Compilar APK V1.00
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPILANDO APK FLYBRAIN V1.00"
          echo "========================================"

          gradle --version

          gradle :app:assembleDebug --stacktrace --no-daemon

          echo "========================================"
          echo "COMPILACION FINALIZADA"
          echo "========================================"


      # ============================================================
      # 19. VERIFICAR APK
      # ============================================================

      - name: Verificar APK V1.00
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO APK V1.00"
          echo "========================================"

          APK="proyecto/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          test -s "$APK"

          echo "APK ENCONTRADO:"
          ls -lh "$APK"

          echo "========================================"
          echo "APK V1.00 VERIFICADO CORRECTAMENTE"
          echo "========================================"


      # ============================================================
      # 20. SUBIR APK COMO ARTIFACT
      # ============================================================

      - name: Subir APK V1.00
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V1.00-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
