name: Build FlyBrain APK V0.96

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================

      - name: Descargar proyecto
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. PYTHON 3.11
      # ============================================================

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'


      # ============================================================
      # 5. GRADLE 8.9
      # ============================================================

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. COMPROBAR ZIP V0.96
      # ============================================================

      - name: Comprobar ZIP V0.96
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPROBANDO ZIP FLYBRAIN V0.96"
          echo "========================================"

          test -f "FlyBrainV096_GitHub_Actions.zip"

          unzip -t "FlyBrainV096_GitHub_Actions.zip" >/dev/null

          ls -lh "FlyBrainV096_GitHub_Actions.zip"

          echo "ZIP V0.96 CORRECTO"


      # ============================================================
      # 7. DESCOMPRIMIR PROYECTO
      # ============================================================

      - name: Descomprimir proyecto V0.96
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DESCOMPRIMIENDO PROYECTO V0.96"
          echo "========================================"

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q "FlyBrainV096_GitHub_Actions.zip" -d proyecto
