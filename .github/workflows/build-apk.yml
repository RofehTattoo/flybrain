name: Build FlyBrain APK V1.11

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO REAL
      # ============================================================
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. PYTHON 3.11
      # ============================================================
      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Preparar Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # ============================================================
      # 5. GRADLE 8.9
      # ============================================================
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ============================================================
      # 6. COMPROBAR ESTRUCTURA DEL REPOSITORIO
      # ============================================================
      - name: Comprobar estructura V1.11
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/flybrain/MainActivity.kt
          test -f app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt
          test -f tools/build_connectome.py
          test -f tools/validate_generated_connectome.py
          test -f .github/workflows/build-apk.yml

          echo "ESTRUCTURA DEL REPOSITORIO: OK"

      # ============================================================
      # 7. IDENTIDAD V1.11
      # ============================================================
      - name: Comprobar identidad V1.11
        run: |
          set -euo pipefail

          APP="app/build.gradle.kts"
          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"
          META="app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"
          BUILDER="tools/build_connectome.py"
          WORKFLOW=".github/workflows/build-apk.yml"

          grep -Fq 'versionCode = 111' "$APP"
          grep -Fq 'versionName = "1.11"' "$APP"
          grep -Fq 'FLYBRAIN V1.11' "$MAIN"
          grep -Fq 'FORMAT_MAGIC = "FBC102"' "$META"
          grep -Fq 'FORMAT_VERSION = 102' "$META"
          grep -Fq 'NEURONS = 16669' "$META"
          grep -Fq 'FBC102' "$BUILDER"
          grep -Fq 'NODE_SIZE = 25' "$BUILDER"
          grep -Fq 'EDGE_SIZE = 12' "$BUILDER"

          grep -Fq 'FBC102' "$WORKFLOW"
          grep -Fq 'FlyBrain-V1.11-APK' "$WORKFLOW"
          grep -Fq 'FORMAT_VERSION = 102' "$BUILDER"

          if grep -Eq 'versionCode = 102|versionName = "1\\.02"|FLYBRAIN V1\\.02|flybrain_version": "1\\.02"' \
              "$APP" "$MAIN" "$META" "$BUILDER"; then
            echo "ERROR: referencia V1.02 detectada en archivos activos"
            exit 1
          fi

          echo "IDENTIDAD V1.11: OK"

      # ============================================================
      # 8. PYTHON: SINTAXIS + REGRESION DE ARRAYS SELECCIONADOS
      # ============================================================
      - name: Validar scripts Python V1.11
        run: |
          set -euo pipefail

          python -m py_compile tools/build_connectome.py
          python -m py_compile tools/validate_generated_connectome.py

          python - <<'PY'
          import re
          from pathlib import Path

          s = Path("tools/build_connectome.py").read_text()

          required = [
              "channel_selected",
              "descending_role_selected",
              "motor_role_selected",
              "route_forward_selected",
              "route_turn_selected",
              "route_escape_selected",
          ]

          for name in required:
              assert re.search(rf"\b{name}\s*=", s), (
                  f"missing assignment: {name}"
              )

          assert "src_ch = int(channel_selected[src_i])" in s
          assert "src_ch = int(channel[src_i])" not in s
          assert "ch = int(channel_selected[i])" in s
          assert "np.where(channel_selected == code)[0]" in s
          assert "np.where(channel == code)[0]" not in s

          for token in ("dng100", "dng97", "dnb08", "dnp01"):
              assert token in s.lower(), token

          main_text = Path(
              "app/src/main/java/com/example/flybrain/MainActivity.kt"
          ).read_text()
          assert "validateGeneratedMeta" in main_text

          print("REGRESION SELECTED-ARRAYS + ROLES: OK")
          PY

      # ============================================================
      # 9. DEPENDENCIAS PYTHON
      # ============================================================
      - name: Instalar dependencias Python
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow

      # ============================================================
      # 10. GENERAR MALECNS REDUCIDO REAL
      # ============================================================
      - name: Generar reducción real MaleCNS V1.11
        run: |
          set -euo pipefail

          echo "Dataset: MaleCNS v1.0"
          echo "Objetivo: 16.669 neuronas"
          echo "Formato: FBC102"

          python tools/build_connectome.py

          test -s app/src/main/res/raw/malecns_reduced.bin
          test -s app/src/main/res/raw/malecns_reduced_report.json
          test -s app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt

          ls -lh app/src/main/res/raw/malecns_reduced.bin

      # ============================================================
      # 11. VALIDADOR INDEPENDIENTE
      # ============================================================
      - name: Validar connectome FBC102 independientemente
        run: |
          set -euo pipefail

          python tools/validate_generated_connectome.py

      # ============================================================
      # 12. VALIDAR REPORT
      # ============================================================
      - name: Validar report MaleCNS y rutas
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("app/src/main/res/raw/malecns_reduced_report.json")
          d = json.loads(p.read_text())

          assert d["dataset"] == "MaleCNS v1.0"
          assert d["flybrain_version"] == "1.11"
          assert d["binary_format"] == "FBC102"
          assert d["neurons_retained"] == 16669
          assert d["node_record_bytes"] == 25
          assert d["edge_record_bytes"] == 12
          assert d["edges_retained"] > 0
          assert d["contacts_retained_signed"] > 0
          assert d["retained_sensor_to_desc_edges"] > 0
          assert d["retained_sensor_to_desc_contacts"] > 0

          # Direct DN->MN connections are biologically sparse and are not a
          # required condition for a valid motor pathway. Validate the actual
          # retained two-hop architecture instead: DN -> intermediate/premotor
          # -> VNC motor, using only published edges.
          assert d["retained_desc_to_intermediate_edges"] > 0
          assert d["retained_intermediate_to_motor_edges"] > 0
          assert d["retained_desc_to_intermediate_to_motor_paths"] > 0

          # Runtime population ranges must index the selected 16,669-node array.
          ranges = d["channel_ranges"]
          previous = 0
          for name in ("visual", "olfactory", "gustatory", "mechanosensory", "other"):
              pair = ranges[name]
              assert len(pair) == 2, (name, pair)
              start, end = map(int, pair)
              assert 0 <= start <= end <= 16669, (name, pair)
              assert start == previous, (name, pair, previous)
              previous = end
          assert previous == 16669

          role_counts = d["descending_role_counts"]
          assert int(role_counts.get("1", 0)) > 0
          assert int(role_counts.get("2", 0)) > 0
          assert int(role_counts.get("4", 0)) > 0

          rs = d["route_score_selected_counts"]

          assert rs["forward_nonzero"] > 0
          assert rs["turn_nonzero"] > 0
          assert rs["escape_nonzero"] > 0

          sensor_desc = d[
              "retained_sensor_to_desc_by_channel_role_contacts"
          ]

          desc_motor = d[
              "retained_desc_to_motor_by_role_contacts"
          ]

          assert len(sensor_desc) == 4
          assert all(len(r) == 5 for r in sensor_desc)

          assert len(desc_motor) == 5
          assert all(len(r) == 8 for r in desc_motor)
          assert sensor_desc[0][4] > 0

          assert sum(map(sum, sensor_desc)) > 0
          # The direct DN->MN matrix is diagnostic only; it may legitimately be
          # zero in a reduced graph. The two-hop path matrix is the required test.
          two_hop = d["retained_desc_to_intermediate_to_motor_by_role_paths"]
          assert len(two_hop) == 5
          assert all(len(r) == 8 for r in two_hop)
          assert sum(map(sum, two_hop)) > 0

          print("REPORT Y RUTAS: OK")
          print("neurons:", d["neurons_retained"])
          print("edges:", d["edges_retained"])
          print("sensor->DN edges:", d["retained_sensor_to_desc_edges"])
          print("DN->motor direct edges (diagnostic):", d["retained_desc_to_motor_edges"])
          print("DN->intermediate edges:", d["retained_desc_to_intermediate_edges"])
          print("intermediate->motor edges:", d["retained_intermediate_to_motor_edges"])
          print("DN->intermediate->motor paths:", d["retained_desc_to_intermediate_to_motor_paths"])
          print("route cells:", rs)
          PY

      # ============================================================
      # 13. VALIDAR BINARIO FBC102
      # ============================================================
      - name: Validar estructura binaria FBC102
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import struct
          import json
          import math

          BIN = Path("app/src/main/res/raw/malecns_reduced.bin")
          REPORT = Path(
              "app/src/main/res/raw/malecns_reduced_report.json"
          )

          data = BIN.read_bytes()
          report = json.loads(REPORT.read_text())

          MAGIC = b"FBC102\x00\x00"
          HEADER_SIZE = 16
          NODE_SIZE = 25
          EDGE_SIZE = 12
          TARGET = 16669

          assert data[:8] == MAGIC

          n, e = struct.unpack_from("<II", data, 8)

          assert n == TARGET
          assert e == report["edges_retained"]
          assert e > 0

          expected = HEADER_SIZE + n * NODE_SIZE + e * EDGE_SIZE

          assert len(data) == expected

          node_start = HEADER_SIZE
          edge_start = node_start + n * NODE_SIZE

          route_counts = [0, 0, 0]
          motor_nodes = 0
          descending_nodes = 0

          for i in range(n):
              off = node_start + i * NODE_SIZE

              rec = struct.unpack_from(
                  "<qbbbbbfff",
                  data,
                  off
              )

              (
                  body_id,
                  superclass,
                  side,
                  channel,
                  motor_role,
                  descending_role,
                  rf,
                  rt,
                  re,
              ) = rec

              assert body_id > 0
              assert side in (-1, 0, 1)
              assert 0 <= channel <= 4
              assert 0 <= motor_role <= 7
              assert 0 <= descending_role <= 4

              for value in (rf, rt, re):
                  assert math.isfinite(value)
                  assert 0.0 <= value <= 1.0

              route_counts[0] += rf > 0
              route_counts[1] += rt > 0
              route_counts[2] += re > 0

              motor_nodes += motor_role > 0
              descending_nodes += descending_role > 0

          assert all(route_counts)
          assert motor_nodes > 0
          assert descending_nodes > 0

          for i in range(e):
              off = edge_start + i * EDGE_SIZE

              src, dst, weight = struct.unpack_from(
                  "<iif",
                  data,
                  off
              )

              assert 0 <= src < n
              assert 0 <= dst < n
              assert math.isfinite(weight)
              assert weight != 0.0

          assert edge_start + e * EDGE_SIZE == len(data)

          print("BINARIO FBC102: OK")
          print("bytes:", len(data), "neurons:", n, "edges:", e)
          print("route nodes:", route_counts)
          print("motor nodes:", motor_nodes)
          print("descending nodes:", descending_nodes)
          PY

      # ============================================================
      # 14. ROLES MOTOR + DESCENDENTES
      # ============================================================
      - name: Validar roles motores y descendentes
        run: |
          set -euo pipefail

          META="app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"
          REPORT="app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'MOTOR_LEG = 1' "$META"
          grep -Fq 'MOTOR_WING = 2' "$META"
          grep -Fq 'MOTOR_HALTERE = 3' "$META"
          grep -Fq 'MOTOR_NECK = 4' "$META"
          grep -Fq 'MOTOR_ABDOMEN = 5' "$META"
          grep -Fq 'MOTOR_JUMP = 6' "$META"
          grep -Fq 'MOTOR_OTHER = 7' "$META"

          grep -Fq 'descending_role_counts' "$REPORT"
          grep -Fq 'descending_role_definition' "$REPORT"

          echo "ROLES MOTOR + DESCENDENTES: OK"

      # ============================================================
      # 15. DINAMICA + DIAGNOSTICOS + ACCIONES
      # ============================================================
      - name: Validar dinámica, diagnóstico y acciones
        run: |
          set -euo pipefail

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          for x in \
            synTrace \
            synDecay \
            motorActivityMemory \
            visualRateDisplay \
            olfactoryRateDisplay \
            gustatoryRateDisplay \
            mechanosensoryRateDisplay \
            centralRateDisplay \
            descendingRateDisplay \
            ascendingRateDisplay \
            motorRateDisplay \
            forwardRouteActivityDisplay \
            turnRouteActivityDisplay \
            escapeRouteActivityDisplay \
            homeostaticDrive \
            arousalDrive \
            restState \
            restStateBlend \
            behavioralPause \
            behavioralPauseTimer \
            behavioralPauseCooldown \
            haltEvidenceDisplay \
            approachAction \
            escapeAction \
            orientAction \
            exploreAction \
            brakeAction \
            turnLeftAction \
            turnRightAction \
            updateActionSelection
          do
            grep -Fq "$x" "$MAIN"
          done

          if grep -Eq 'locomotorDrive|locomotorPhase|quietLocomotionTime|locomotorOsc' "$MAIN"; then
            echo "ERROR: oscilador locomotor continuo de versiones anteriores detectado"
            exit 1
          fi

          grep -Fq 'sleepPressure += dt * pressureRate' "$MAIN"
          grep -Fq 'val restEntryHazard = (' "$MAIN"
          grep -Fq 'val restEntryProbability =' "$MAIN"
          grep -Fq 'val spontaneousWakeHazard =' "$MAIN"
          grep -Fq 'val wakeProbability =' "$MAIN"
          grep -Fq 'val haltEdgeGain = if (targetIsMotor)' "$MAIN"
          grep -Fq 'descendingRole[source].toInt() == 3' "$MAIN"
          grep -Fq 'pauseDetected = inactivityContinuous >= .80f' "$MAIN"
          grep -Fq 'val restInhibition = if (!isSensor && !isMotor && restState)' "$MAIN"

          if grep -Eq 'behavioralPause|behavioralPauseTimer|behavioralPauseCooldown|motorPauseInhibition|val pauseHazard' "$MAIN"; then
            echo 'ERROR: external random pause controller detected in V1.11'
            exit 1
          fi

          if grep -Eq 'sleepPressure >|sleepPressure <|homeostaticDrive >|homeostaticDrive <|restPressure >|restPressure <|wakePressure >|wakePressure <' "$MAIN"; then
            echo 'ERROR: hard homeostatic/arousal threshold detected in V1.11'
            exit 1
          fi

          echo "DINAMICA / DIAGNOSTICO / ACCIONES: OK"

      # ============================================================
      # 16. INTEGRIDAD CAUSAL Y FAIL-CLOSED
      # ============================================================
      - name: Verificar integridad causal
        run: |
          set -euo pipefail

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'connectomeLoaded' "$MAIN"
          grep -Fq 'connectomeError' "$MAIN"
          grep -Fq 'expectedBytes' "$MAIN"
          grep -Fq 'bytes.size.toLong() != expectedBytes' "$MAIN"
          grep -Fq 'bytes restantes=' "$MAIN"
          grep -Fq 'edge[$it] fuera de rango' "$MAIN"
          grep -Fq 'edge[$it] con peso invalido' "$MAIN"
          grep -Fq 'plasticityEnabled = false' "$MAIN"

          if grep -Fq 'buildFallbackBrain' "$MAIN"; then
            echo "ERROR: fallback neuronal artificial detectado"
            exit 1
          fi

          if grep -Eq \
            'foodOn.*(approachAction|approachMotor)|food.*=.*approachAction' \
            "$MAIN"
          then
            echo "ERROR: posible atajo comida -> aproximación"
            exit 1
          fi

          if grep -Eq \
            'dangerOn.*(escapeAction|escapeMotor)|danger.*=.*escapeAction' \
            "$MAIN"
          then
            echo "ERROR: posible atajo peligro -> escape"
            exit 1
          fi

          grep -Fq 'if (danger > .68f && lastDangerLevel <= .68f && escapeNeural)' "$MAIN"
          grep -Fq 'if (foodOn && foodDistance < .055f && gustatoryRateNow > .04f' "$MAIN"

          if grep -Eq 'restState.*(flyX|flyY|flySpeed|heading)|homeostaticDrive.*(flyX|flyY|flySpeed|heading)|arousalDrive.*(flyX|flyY|flySpeed|heading)' "$MAIN"; then
            echo "ERROR: reposo conectado directamente a la mecánica corporal"
            exit 1
          fi

          echo "INTEGRIDAD CAUSAL: OK"

      # ============================================================
      # 17. KOTLIN ESTRUCTURAL
      # ============================================================
      - name: Validar estructura Kotlin V1.11
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          s = Path(
              "app/src/main/java/com/example/flybrain/MainActivity.kt"
          ).read_text()

          assert s.count("{") == s.count("}")
          assert s.count("(") == s.count(")")
          assert s.count("[") == s.count("]")

          assert "FBC102" not in s
          assert "GeneratedConnectomeMeta.FORMAT_MAGIC" in s

          assert "val nodeBytes = n.toLong() * 25L" in s
          assert "val edgeBytes = e.toLong() * 12L" in s

          assert "routeForward[it] = b.float" in s
          assert "routeTurn[it] = b.float" in s
          assert "routeEscape[it] = b.float" in s

          print("KOTLIN ESTRUCTURAL: OK")
          PY

      # ============================================================
      # 18. VALIDACION FINAL ANTES DE GRADLE
      # ============================================================
      - name: Validación final del proyecto
        run: |
          set -euo pipefail

          test -s app/src/main/res/raw/malecns_reduced.bin
          test -s app/src/main/res/raw/malecns_reduced_report.json

          grep -Fq 'versionCode = 111' \
            app/build.gradle.kts

          grep -Fq 'versionName = "1.11"' \
            app/build.gradle.kts

          grep -Fq 'FORMAT_VERSION = 102' \
            app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt

          grep -Fq 'NEURONS = 16669' \
            app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt

          grep -Fq '"flybrain_version": "1.11"' \
            app/src/main/res/raw/malecns_reduced_report.json

          grep -Fq '"binary_format": "FBC102"' \
            app/src/main/res/raw/malecns_reduced_report.json

          echo "VALIDACION PRE-GRADLE: OK"

      # ============================================================
      # 19. COMPILAR APK
      # ============================================================
      - name: Compilar APK V1.11
        run: |
          set -euo pipefail

          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      # ============================================================
      # 20. VERIFICAR APK REAL
      # ============================================================
      - name: Verificar APK V1.11
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c -v 4 \
            "$APK"

          BADGING="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" | \
            grep -Fq "package: name='com.example.flybrain'"

          echo "$BADGING" | \
            grep -Fq "versionCode='111'"

          echo "$BADGING" | \
            grep -Fq "versionName='1.11'"

          unzip -l "$APK" | \
            grep -Fq 'malecns_reduced.bin'

          unzip -l "$APK" | \
            grep -Fq 'malecns_reduced_report.json'

          echo "APK V1.11 VALIDADO"

          ls -lh "$APK"

          sha256sum "$APK"

      # ============================================================
      # 21. SUBIR APK
      # ============================================================
      - name: Subir APK V1.11
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V1.11-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
