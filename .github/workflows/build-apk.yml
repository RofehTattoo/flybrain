name: Build FlyBrain APK V0.94 FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4


      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'


      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Comprobar ZIP V0.94
        run: |
          set -e

          echo "Buscando archivo del proyecto..."

          test -f "FlyBrainV094_FIXED_GitHub_Actions.zip"

          echo "ZIP encontrado correctamente:"
          ls -lh "FlyBrainV094_FIXED_GitHub_Actions.zip"


      - name: Descomprimir proyecto V0.94 FIXED
        run: |
          set -e

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q "FlyBrainV094_FIXED_GitHub_Actions.zip" -d proyecto

          echo "========================================"
          echo "Proyecto descomprimido correctamente"
          echo "========================================"

          find proyecto -maxdepth 4 -type f | sort


      - name: Verificar proyecto V0.94 FIXED
        run: |
          set -e

          test -f "proyecto/app/build.gradle.kts"
          test -f "proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'versionCode = 94' \
            "proyecto/app/build.gradle.kts"

          grep -Fq 'versionName = "0.94"' \
            "proyecto/app/build.gradle.kts"

          grep -Fq 'FLYBRAIN V0.94' \
            "proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'N = 16669' \
            "proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt"

          echo "========================================"
          echo "PROYECTO V0.94 FIXED CORRECTO"
          echo "========================================"
          echo "Version: 0.94"
          echo "VersionCode: 94"
          echo "Neuronas: 16.669"
          echo "LIF adaptativo + plasticidad"
          echo "Navegacion y estados premotores"
          echo "Respuesta a comida, luz y peligro"
          echo "Aproximacion a comida reforzada"
          echo "Modelo visual 2D mejorado"
          echo "Correccion de compilacion aplicada"
          echo "========================================"


      - name: Compilar APK
        working-directory: proyecto
        run: |
          set -e

          gradle :app:assembleDebug --stacktrace


      - name: Verificar APK
        run: |
          set -e

          test -f "proyecto/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK V0.94 FIXED GENERADO CORRECTAMENTE"
          echo "========================================"

          ls -lh "proyecto/app/build/outputs/apk/debug/app-debug.apk"


      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V0.94-FIXED-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
