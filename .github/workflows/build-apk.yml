name: Build FlyBrain APK FIXED

on:
  workflow_dispatch:
  push:
    branches: [ "principal", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4


      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'


      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Descomprimir proyecto FIXED
        run: |
          set -e

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q FlyBrainV092_FIXED_GitHub_Actions.zip -d proyecto

          echo "========================================"
          echo "Contenido del proyecto:"
          find proyecto -maxdepth 4 -type f | sort
          echo "========================================"


      - name: Verificar proyecto V0.92 FIXED
        run: |
          set -e

          test -f proyecto/app/build.gradle.kts
          test -f proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt

          grep -q 'versionCode = 92' proyecto/app/build.gradle.kts
          grep -q 'versionName = "0.92"' proyecto/app/build.gradle.kts
          grep -q 'FLYBRAIN V0.92' proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt
          grep -q 'N=16669' proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt

          echo "========================================"
          echo "PROYECTO V0.92 FIXED CORRECTO"
          echo "16.669 neuronas"
          echo "MaleCNS reducido al 10%"
          echo "Error de sintaxis corregido"
          echo "========================================"


      - name: Compilar APK
        working-directory: proyecto
        run: |
          gradle :app:assembleDebug --stacktrace


      - name: Verificar APK
        run: |
          set -e

          test -f proyecto/app/build/outputs/apk/debug/app-debug.apk

          echo "========================================"
          echo "APK V0.92 FIXED GENERADO CORRECTAMENTE"
