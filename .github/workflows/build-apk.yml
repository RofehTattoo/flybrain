name: Build FlyBrain APK

on:
  workflow_dispatch:
  push:
    branches: [ "principal", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          mkdir proyecto_tmp
          unzip -q FlyBrainV05_GitHub_Actions.zip -d proyecto_tmp
          cp -r proyecto_tmp/FlyBrainV05_GitHub_Actions/. proyecto/
          rm -rf proyecto_tmp

      - name: Verificar proyecto
        run: |
          test -f proyecto/app/build.gradle.kts
          test -f proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt
          echo "Proyecto V0.5 encontrado correctamente"

      - name: Compilar APK
        working-directory: proyecto
        run: gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V0.5-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
