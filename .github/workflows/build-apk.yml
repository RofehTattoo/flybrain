name: Build FlyBrain APK

on:
  workflow_dispatch:
  push:
    branches: [ "principal", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4


      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'


      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Descomprimir proyecto
        run: |
          set -e

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q FlyBrainV092_GitHub_Actions.zip -d proyecto

          echo "Contenido del proyecto:"
          find proyecto -maxdepth 4 -type f | sort


      - name: Verificar proyecto V0.92
        run: |
          set -e

          test -f proyecto/app/build.gradle.kts
          test -f proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt

          grep -q 'versionCode = 92' proyecto/app/build.gradle.kts
          grep -q 'versionName = "0.92"' proyecto/app/build.gradle.kts
          grep -q 'FLYBRAIN V0.92' proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt
          grep -q 'N=16669' proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt

          echo "========================================"
          echo "Proyecto V0.92 encontrado correctamente"
          echo "16.669 neuronas"
          echo "MaleCNS reducido al 10%"
          echo "========================================"


      - name: Compilar APK
        working-directory: proyecto
        run: |
          gradle :app:assembleDebug --stacktrace


      - name: Verificar APK
        run: |
          set -e

          test -f proyecto/app/build/outputs/apk/debug/app-debug.apk

          echo "========================================"
          echo "APK generado correctamente"
          echo "========================================"

          ls -lh proyecto/app/build/outputs/apk/debug/app-debug.apk


      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V0.92-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
