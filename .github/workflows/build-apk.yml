name: Build FlyBrain APK

on:
  workflow_dispatch:
  push:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q FlyBrainV01_GitHub_Actions.zip -d proyecto

      - name: Corregir versión Java
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("proyecto/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace('JvmTarget.JVM_1_8', 'JvmTarget.JVM_17')

          p.write_text(s)

          print("Configuración Java/Kotlin corregida:")
          for line in s.splitlines():
              if "JavaVersion" in line or "jvmTarget" in line or "JvmTarget" in line:
                  print(line)
          PY

      - name: Verificar configuración
        run: |
          grep -RniE "VERSION_1_8|JVM_1_8|jvmTarget|sourceCompatibility|targetCompatibility" proyecto/app/build.gradle.kts || true

      - name: Compilar APK
        working-directory: proyecto
        run: gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V0.1-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
