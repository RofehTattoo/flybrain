name: Build FlyBrain APK V1.01

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================

      - name: Descargar proyecto
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. PYTHON 3.11
      # ============================================================

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'


      # ============================================================
      # 5. GRADLE 8.9
      # ============================================================

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. COMPROBAR ZIP V1.01
      # ============================================================

      - name: Comprobar ZIP V1.01
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPROBANDO ZIP FLYBRAIN V1.01"
          echo "========================================"

          ZIP="FlyBrainV101_GitHub_Actions.zip"

          test -f "$ZIP"

          unzip -t "$ZIP" >/dev/null

          echo "ZIP:"
          ls -lh "$ZIP"

          echo "ZIP V1.01 INTEGRO"


      # ============================================================
      # 7. DESCOMPRIMIR PROYECTO V1.01
      # ============================================================

      - name: Descomprimir proyecto V1.01
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DESCOMPRIMIENDO PROYECTO V1.01"
          echo "========================================"

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q "FlyBrainV101_GitHub_Actions.zip" -d proyecto

          echo "Comprobando estructura..."

          test -f "proyecto/settings.gradle.kts"
          test -f "proyecto/build.gradle.kts"
          test -f "proyecto/gradle.properties"

          test -f "proyecto/tools/build_connectome.py"

          test -f "proyecto/app/build.gradle.kts"

          test -f "proyecto/app/src/main/AndroidManifest.xml"

          test -f \
            "proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt"

          test -f \
            "proyecto/app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          echo "ESTRUCTURA V1.01 CORRECTA"


      # ============================================================
      # 8. COMPROBAR IDENTIDAD DE LA VERSION
      # ============================================================

      - name: Comprobar identidad V1.01
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPROBANDO IDENTIDAD FLYBRAIN V1.01"
          echo "========================================"

          APP_GRADLE="app/build.gradle.kts"
          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"
          META="app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"
          BUILDER="tools/build_connectome.py"

          # --------------------------------------------------------
          # VERSION ANDROID
          # --------------------------------------------------------

          grep -Fq 'versionCode = 101' "$APP_GRADLE"
          grep -Fq 'versionName = "1.01"' "$APP_GRADLE"

          # --------------------------------------------------------
          # IDENTIDAD DE LA APP
          # --------------------------------------------------------

          grep -Fq 'FLYBRAIN V1.01' "$MAIN"

          # --------------------------------------------------------
          # FORMATO DEL CONNECTOME
          #
          # MainActivity utiliza:
          # GeneratedConnectomeMeta.FORMAT_MAGIC
          #
          # Por tanto NO buscamos FBC101 literalmente en MainActivity.
          # --------------------------------------------------------

          grep -Fq 'FORMAT_MAGIC = "FBC101"' "$META"
          grep -Fq 'FORMAT_VERSION = 101' "$META"

          grep -Fq 'FBC101' "$BUILDER"

          # --------------------------------------------------------
          # NUMERO DE NEURONAS
          # --------------------------------------------------------

          grep -Fq 'NEURONS = 16669' "$META"

          echo "========================================"
          echo "IDENTIDAD V1.01 CONFIRMADA"
          echo "========================================"

          echo "Version: 1.01"
          echo "VersionCode: 101"
          echo "Neuronas: 16.669"
          echo "Formato: FBC101"


      # ============================================================
      # 9. INSTALAR DEPENDENCIAS PYTHON
      # ============================================================

      - name: Instalar dependencias Python
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO DEPENDENCIAS PYTHON"
          echo "========================================"

          python -m pip install --upgrade pip

          python -m pip install \
            numpy \
            pandas \
            pyarrow

          echo "DEPENDENCIAS PYTHON INSTALADAS"


      # ============================================================
      # 10. VALIDAR SCRIPT MALECNS
      # ============================================================

      - name: Validar extractor MaleCNS V1.01
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO BUILD_CONNECTOME.PY"
          echo "========================================"

          python -m py_compile \
            tools/build_connectome.py

          echo "BUILD_CONNECTOME.PY CORRECTO"


      # ============================================================
      # 11. GENERAR CONNECTOME MALECNS
      # ============================================================

      - name: Generar reducción real MaleCNS V1.01
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GENERANDO REDUCCION REAL MALECNS"
          echo "========================================"

          echo "Dataset: MaleCNS v1.0"
          echo "Objetivo: 16.669 neuronas"
          echo "Formato: FBC101"

          python tools/build_connectome.py

          echo "========================================"
          echo "COMPROBANDO ARCHIVOS GENERADOS"
          echo "========================================"

          test -f \
            "app/src/main/res/raw/malecns_reduced.bin"

          test -f \
            "app/src/main/res/raw/malecns_reduced_report.json"

          test -f \
            "app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          echo "ARCHIVOS GENERADOS"


      # ============================================================
      # 12. VALIDAR REPORT JSON
      # ============================================================

      - name: Validar informe MaleCNS
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO REPORT MALECNS"
          echo "========================================"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "app/src/main/res/raw/"
              "malecns_reduced_report.json"
          )

          data = json.loads(path.read_text())

          assert data["dataset"] == "MaleCNS v1.0"
          assert data["flybrain_version"] == "1.01"
          assert data["binary_format"] == "FBC101"

          assert data["neurons_retained"] == 16669

          assert data["edges_retained"] > 0
          assert data["contacts_retained_signed"] > 0

          assert data["functional_bridge_candidates_retained"] > 0

          assert data["retained_sensor_to_desc_edges"] > 0
          assert data["retained_desc_to_motor_edges"] > 0

          assert "motor_role_counts" in data
          assert "descending_role_counts" in data

          assert "motor_role_definition" in data
          assert "descending_role_definition" in data

          print("REPORT MALECNS OK")
          print("----------------------------------------")
          print("Dataset:", data["dataset"])
          print("Version:", data["flybrain_version"])
          print("Formato:", data["binary_format"])
          print("Neuronas:", data["neurons_retained"])
          print("Edges:", data["edges_retained"])
          print(
              "Sensor -> DN:",
              data["retained_sensor_to_desc_edges"]
          )
          print(
              "DN -> Motor:",
              data["retained_desc_to_motor_edges"]
          )
          print(
              "Bridge candidates:",
              data["functional_bridge_candidates_retained"]
          )
          PY


      # ============================================================
      # 13. VALIDAR BINARIO FBC101
      # ============================================================

      - name: Validar binario FBC101
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO BINARIO FBC101"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path
          import struct
          import json
          import math

          BIN = Path(
              "app/src/main/res/raw/"
              "malecns_reduced.bin"
          )

          REPORT = Path(
              "app/src/main/res/raw/"
              "malecns_reduced_report.json"
          )

          data = BIN.read_bytes()
          report = json.loads(REPORT.read_text())

          # ========================================================
          # CABECERA
          # ========================================================

          assert len(data) >= 16

          magic = data[:8]

          assert magic == b"FBC101\x00\x00", (
              f"Magic incorrecto: {magic!r}"
          )

          # ========================================================
          # NUMERO DE NODOS Y EDGES
          # ========================================================

          n, e = struct.unpack_from("<II", data, 8)

          assert n == 16669, (
              f"Neuronas incorrectas: {n}"
          )

          assert e == report["edges_retained"], (
              f"Edges bin/report diferentes: "
              f"{e} != {report['edges_retained']}"
          )

          assert e > 0

          # ========================================================
          # FORMATO DE NODOS
          #
          # <qbbbbb
          #
          # q = bodyId
          # b = superclass
          # b = side
          # b = channel
          # b = motor_role
          # b = descending_role
          #
          # TOTAL = 13 bytes
          # ========================================================

          NODE_SIZE = 13

          # ========================================================
          # FORMATO DE EDGES
          #
          # <iif
          #
          # src
          # dst
          # weight
          #
          # TOTAL = 12 bytes
          # ========================================================

          EDGE_SIZE = 12

          expected_size = (
              16
              + n * NODE_SIZE
              + e * EDGE_SIZE
          )

          assert len(data) == expected_size, (
              f"Tamaño binario incorrecto: "
              f"{len(data)} != {expected_size}"
          )

          node_start = 16
          edge_start = (
              node_start
              + n * NODE_SIZE
          )

          # ========================================================
          # VALIDAR TODOS LOS NODOS
          # ========================================================

          for i in range(n):

              offset = (
                  node_start
                  + i * NODE_SIZE
              )

              (
                  body_id,
                  superclass,
                  side,
                  channel,
                  motor_role,
                  descending_role,
              ) = struct.unpack_from(
                  "<qbbbbb",
                  data,
                  offset,
              )

              assert body_id > 0, (
                  f"bodyId invalido en nodo {i}"
              )

              assert side in (-1, 0, 1), (
                  f"side invalido en nodo {i}: {side}"
              )

              assert channel in (0, 1, 2, 3, 4), (
                  f"channel invalido en nodo {i}: {channel}"
              )

              assert 0 <= motor_role <= 7, (
                  f"motor_role invalido en nodo {i}: "
                  f"{motor_role}"
              )

          # ========================================================
          # VALIDAR TODOS LOS EDGES
          # ========================================================

          for i in range(e):

              offset = (
                  edge_start
                  + i * EDGE_SIZE
              )

              src, dst, weight = struct.unpack_from(
                  "<iif",
                  data,
                  offset,
              )

              assert 0 <= src < n, (
                  f"src fuera de rango en edge {i}: {src}"
              )

              assert 0 <= dst < n, (
                  f"dst fuera de rango en edge {i}: {dst}"
              )

              assert math.isfinite(weight), (
                  f"peso no finito en edge {i}"
              )

              assert weight != 0.0, (
                  f"peso cero en edge {i}"
              )

          # ========================================================
          # EOF EXACTO
          # ========================================================

          assert (
              edge_start
              + e * EDGE_SIZE
              == len(data)
          )

          print("========================================")
          print("FBC101 VALIDADO COMPLETAMENTE")
          print("========================================")
          print("Magic: FBC101")
          print("Neuronas:", n)
          print("Edges:", e)
          print("Bytes:", len(data))
          print("Node size:", NODE_SIZE)
          print("Edge size:", EDGE_SIZE)
          print("Todos los nodos: OK")
          print("Todos los indices: OK")
          print("Todos los pesos: OK")
          print("EOF exacto: OK")
          PY


      # ============================================================
      # 14. VALIDAR ROLES MOTORES
      # ============================================================

      - name: Validar roles motores
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO ROLES MOTORES"
          echo "========================================"

          META="app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          grep -Fq 'NEURONS = 16669' "$META"

          grep -Fq 'MOTOR_LEG = 1' "$META"
          grep -Fq 'MOTOR_WING = 2' "$META"
          grep -Fq 'MOTOR_HALTERE = 3' "$META"
          grep -Fq 'MOTOR_NECK = 4' "$META"
          grep -Fq 'MOTOR_ABDOMEN = 5' "$META"
          grep -Fq 'MOTOR_JUMP = 6' "$META"
          grep -Fq 'MOTOR_OTHER = 7' "$META"

          echo "ROLES MOTORES OK"


      # ============================================================
      # 15. VALIDAR ROLES DESCENDENTES
      # ============================================================

      - name: Validar roles descendentes
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO ROLES DESCENDENTES"
          echo "========================================"

          REPORT="app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'descending_role_counts' "$REPORT"

          grep -Fq 'descending_role_definition' "$REPORT"

          echo "ROLES DESCENDENTES OK"


      # ============================================================
      # 16. VALIDAR DINAMICA NEURONAL
      # ============================================================

      - name: Validar dinámica neuronal
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO DINAMICA NEURONAL"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'synTrace' "$MAIN"
          grep -Fq 'synDecay' "$MAIN"

          grep -Fq 'locomotorDrive' "$MAIN"
          grep -Fq 'locomotorPhase' "$MAIN"
          grep -Fq 'motorActivityMemory' "$MAIN"

          echo "DINAMICA NEURONAL OK"


      # ============================================================
      # 17. VALIDAR DIAGNOSTICO SENSORIAL
      # ============================================================

      - name: Validar diagnóstico sensorial
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO DIAGNOSTICO SENSORIAL"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'visualRateDisplay' "$MAIN"
          grep -Fq 'olfactoryRateDisplay' "$MAIN"
          grep -Fq 'gustatoryRateDisplay' "$MAIN"
          grep -Fq 'mechanosensoryRateDisplay' "$MAIN"

          echo "DIAGNOSTICO SENSORIAL OK"


      # ============================================================
      # 18. VALIDAR CADENA NEURAL
      # ============================================================

      - name: Validar cadena neural
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO CADENA SENSORIAL -> MOTOR"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'centralRateDisplay' "$MAIN"
          grep -Fq 'descendingRateDisplay' "$MAIN"
          grep -Fq 'ascendingRateDisplay' "$MAIN"
          grep -Fq 'motorRateDisplay' "$MAIN"

          grep -Fq 'stableLocomotion' "$MAIN"

          echo "CADENA NEURAL PRESENTE"


      # ============================================================
      # 19. VALIDAR SELECCION DE ACCIONES
      # ============================================================

      - name: Validar selección de acciones
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO SELECCION COMPETITIVA"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'approachAction' "$MAIN"
          grep -Fq 'escapeAction' "$MAIN"
          grep -Fq 'orientAction' "$MAIN"
          grep -Fq 'exploreAction' "$MAIN"
          grep -Fq 'brakeAction' "$MAIN"

          grep -Fq 'turnLeftAction' "$MAIN"
          grep -Fq 'turnRightAction' "$MAIN"

          grep -Fq 'updateActionSelection' "$MAIN"

          grep -Fq 'descendingRoleRate' "$MAIN"

          echo "SELECCION COMPETITIVA OK"


      # ============================================================
      # 20. VERIFICAR FAIL-CLOSED DEL CONNECTOME
      # ============================================================

      - name: Verificar fail-closed del connectome
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO FAIL-CLOSED"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          # --------------------------------------------------------
          # ESTADO DE CARGA
          # --------------------------------------------------------

          grep -Fq 'connectomeLoaded' "$MAIN"
          grep -Fq 'connectomeError' "$MAIN"

          # --------------------------------------------------------
          # VALIDACION DEL TAMAÑO
          # --------------------------------------------------------

          grep -Fq 'expectedBytes' "$MAIN"
          grep -Fq 'bytes.size.toLong() != expectedBytes' "$MAIN"

          # --------------------------------------------------------
          # VALIDACION DE INDICES
          # --------------------------------------------------------

          grep -Fq 'edge[$it] fuera de rango' "$MAIN"

          # --------------------------------------------------------
          # VALIDACION DE PESOS
          # --------------------------------------------------------

          grep -Fq 'edge[$it] con peso invalido' "$MAIN"

          # --------------------------------------------------------
          # VALIDACION DE BYTES RESTANTES
          # --------------------------------------------------------

          grep -Fq 'bytes restantes=' "$MAIN"

          # --------------------------------------------------------
          # FAIL-CLOSED
          # --------------------------------------------------------

          grep -Fqi 'fail closed' "$MAIN"

          # --------------------------------------------------------
          # NO FALLBACK ARTIFICIAL
          # --------------------------------------------------------

          if grep -Fq 'buildFallbackBrain' "$MAIN"; then
            echo "ERROR: buildFallbackBrain sigue presente"
            exit 1
          fi

          echo "FAIL-CLOSED OK"
          echo "NO EXISTE FALLBACK NEURONAL ARTIFICIAL"


      # ============================================================
      # 21. VERIFICAR PLASTICIDAD
      # ============================================================

      - name: Verificar plasticidad experimental
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO PLASTICIDAD"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'plasticityEnabled = false' "$MAIN"

          echo "PLASTICIDAD EXPERIMENTAL DESACTIVADA"


      # ============================================================
      # 22. VALIDACION FINAL DEL PROYECTO
      # ============================================================

      - name: Validación final del proyecto
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDACION FINAL FLYBRAIN V1.01"
          echo "========================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/res/raw/malecns_reduced.bin

          test -f \
            app/src/main/res/raw/malecns_reduced_report.json

          test -f \
            app/src/main/java/com/example/flybrain/MainActivity.kt

          test -f \
            app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt

          # --------------------------------------------------------
          # VERSION
          # --------------------------------------------------------

          grep -Fq 'versionCode = 101' \
            app/build.gradle.kts

          grep -Fq 'versionName = "1.01"' \
            app/build.gradle.kts

          # --------------------------------------------------------
          # NEURONAS
          # --------------------------------------------------------

          grep -Fq 'NEURONS = 16669' \
            app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt

          # --------------------------------------------------------
          # FORMATO
          # --------------------------------------------------------

          grep -Fq 'FORMAT_MAGIC = "FBC101"' \
            app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt

          grep -Fq 'FORMAT_VERSION = 101' \
            app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt

          # --------------------------------------------------------
          # CONNECTOME LOADER
          # --------------------------------------------------------

          grep -Fq 'connectomeLoaded' \
            app/src/main/java/com/example/flybrain/MainActivity.kt

          # --------------------------------------------------------
          # DIAGNOSTICO
          # --------------------------------------------------------

          grep -Fq 'centralRateDisplay' \
            app/src/main/java/com/example/flybrain/MainActivity.kt

          grep -Fq 'descendingRateDisplay' \
            app/src/main/java/com/example/flybrain/MainActivity.kt

          grep -Fq 'motorRateDisplay' \
            app/src/main/java/com/example/flybrain/MainActivity.kt

          echo "========================================"
          echo "TODAS LAS VALIDACIONES PASADAS"
          echo "========================================"

          echo "Version: 1.01"
          echo "VersionCode: 101"
          echo "Neuronas: 16.669"
          echo "Formato: FBC101"
          echo "Connectome: VALIDADO"
          echo "Binary structure: VALIDADA"
          echo "Sensor -> DN: VALIDADO"
          echo "DN -> Motor: VALIDADO"
          echo "Motor roles: VALIDADO"
          echo "Descending roles: VALIDADO"
          echo "Neural diagnostics: VALIDADO"
          echo "Action selection: VALIDADO"
          echo "Fail-closed: VALIDADO"
          echo "Plasticity: DESACTIVADA"


      # ============================================================
      # 23. COMPILAR APK
      # ============================================================

      - name: Compilar APK V1.01
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPILANDO APK FLYBRAIN V1.01"
          echo "========================================"

          gradle --version

          gradle \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

          echo "========================================"
          echo "COMPILACION FINALIZADA"
          echo "========================================"


      # ============================================================
      # 24. VERIFICAR APK
      # ============================================================

      - name: Verificar APK V1.01
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO APK V1.01"
          echo "========================================"

          APK="proyecto/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK ENCONTRADO:"
          ls -lh "$APK"

          echo "========================================"
          echo "APK V1.01 VERIFICADO"
          echo "========================================"


      # ============================================================
      # 25. SUBIR APK COMO ARTIFACT
      # ============================================================

      - name: Subir APK V1.01
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V1.01-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
