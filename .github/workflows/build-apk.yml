name: Build FlyBrain APK V0.99

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. DESCARGAR REPOSITORIO
      # ============================================================

      - name: Descargar proyecto
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. PYTHON 3.11
      # ============================================================

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'


      # ============================================================
      # 5. GRADLE 8.9
      # ============================================================

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. COMPROBAR ZIP V0.99
      # ============================================================

      - name: Comprobar ZIP V0.99
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPROBANDO ZIP FLYBRAIN V0.99"
          echo "========================================"

          test -f "FlyBrainV099_GitHub_Actions.zip"

          unzip -t "FlyBrainV099_GitHub_Actions.zip" >/dev/null

          ls -lh "FlyBrainV099_GitHub_Actions.zip"

          echo "ZIP V0.99 CORRECTO"


      # ============================================================
      # 7. DESCOMPRIMIR PROYECTO V0.99
      # ============================================================

      - name: Descomprimir proyecto V0.99
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DESCOMPRIMIENDO PROYECTO V0.99"
          echo "========================================"

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q "FlyBrainV099_GitHub_Actions.zip" -d proyecto

          echo "Comprobando estructura..."

          test -f "proyecto/settings.gradle.kts"
          test -f "proyecto/build.gradle.kts"
          test -f "proyecto/gradle.properties"

          test -f "proyecto/tools/build_connectome.py"

          test -f "proyecto/app/build.gradle.kts"

          test -f "proyecto/app/src/main/AndroidManifest.xml"

          test -f "proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt"

          test -f "proyecto/app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          echo "ESTRUCTURA V0.99 CORRECTA"


      # ============================================================
      # 8. INSTALAR DEPENDENCIAS PYTHON
      # ============================================================

      - name: Instalar dependencias del extractor
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO DEPENDENCIAS PYTHON"
          echo "========================================"

          python -m pip install --upgrade pip

          python -m pip install numpy pandas pyarrow

          echo "DEPENDENCIAS PYTHON INSTALADAS"


      # ============================================================
      # 9. VALIDAR SCRIPT MALECNS
      # ============================================================

      - name: Validar extractor MaleCNS V0.99
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO BUILD_CONNECTOME.PY"
          echo "========================================"

          python -m py_compile tools/build_connectome.py

          echo "BUILD_CONNECTOME.PY CORRECTO"


      # ============================================================
      # 10. GENERAR REDUCCIÓN MALECNS V0.99
      # ============================================================

      - name: Generar reducción real MaleCNS V0.99
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GENERANDO REDUCCION REAL MALECNS"
          echo "VERSION V0.99"
          echo "OBJETIVO: 16.669 NEURONAS"
          echo "========================================"

          python tools/build_connectome.py

          echo "========================================"
          echo "COMPROBANDO ARCHIVOS GENERADOS"
          echo "========================================"

          test -f "app/src/main/res/raw/malecns_reduced.bin"

          test -f "app/src/main/res/raw/malecns_reduced_report.json"

          test -f "app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          grep -Fq '"neurons_retained": 16669' \
            "app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'functional_bridge_candidates_retained' \
            "app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'retained_sensor_to_desc_edges' \
            "app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'retained_desc_to_motor_edges' \
            "app/src/main/res/raw/malecns_reduced_report.json"

          echo "ARCHIVOS MALECNS V0.99 GENERADOS Y VERIFICADOS"

          ls -lh "app/src/main/res/raw/malecns_reduced.bin"


      # ============================================================
      # 11. VERIFICAR ROLES MOTORES
      # ============================================================

      - name: Verificar roles motores V0.99
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO ROLES MOTORES V0.99"
          echo "========================================"

          META="app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"

          grep -Fq 'NEURONS = 16669' "$META"

          grep -Fq 'MOTOR_LEG = 1' "$META"

          grep -Fq 'MOTOR_WING = 2' "$META"

          grep -Fq 'MOTOR_HALTERE = 3' "$META"

          grep -Fq 'MOTOR_NECK = 4' "$META"

          grep -Fq 'MOTOR_ABDOMEN = 5' "$META"

          grep -Fq 'MOTOR_JUMP = 6' "$META"

          grep -Fq 'MOTOR_OTHER = 7' "$META"

          echo "ROLES MOTORES V0.99 CORRECTOS"


      # ============================================================
      # 12. VERIFICAR ROLES DESCENDENTES
      # ============================================================

      - name: Verificar roles descendentes V0.99
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO ROLES DESCENDENTES"
          echo "========================================"

          REPORT="app/src/main/res/raw/malecns_reduced_report.json"

          grep -Fq 'descending_role_counts' "$REPORT"

          grep -Fq 'descending_role_definition' "$REPORT"

          echo "ROLES DESCENDENTES V0.99 CORRECTOS"


      # ============================================================
      # 13. VERIFICAR DIAGNÓSTICO NEURAL V0.99
      # ============================================================

      - name: Verificar diagnóstico neural V0.99
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO DIAGNOSTICO NEURAL V0.99"
          echo "========================================"

          MAIN="app/src/main/java/com/example/flybrain/MainActivity.kt"

          grep -Fq 'sensoryTrace' "$MAIN"

          grep -Fq 'centralTrace' "$MAIN"

          grep -Fq 'descendingTrace' "$MAIN"

          grep -Fq 'motorTrace' "$MAIN"

          grep -Fq 'synapticTrace' "$MAIN"

          grep -Fq 'stableLocomotion' "$MAIN"

          echo "DIAGNOSTICO NEURAL V0.99 CORRECTO"


      # ============================================================
      # 14. VERIFICAR PROYECTO V0.99
      # ============================================================

      - name: Verificar proyecto V0.99
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO PROYECTO FLYBRAIN V0.99"
          echo "========================================"

          APP_GRADLE="proyecto/app/build.gradle.kts"
          MAIN="proyecto/app/src/main/java/com/example/flybrain/MainActivity.kt"
          META="proyecto/app/src/main/java/com/example/flybrain/GeneratedConnectomeMeta.kt"
          REPORT="proyecto/app/src/main/res/raw/malecns_reduced_report.json"

          test -f "$APP_GRADLE"
          test -f "$MAIN"
          test -f "$META"
          test -f "proyecto/app/src/main/res/raw/malecns_reduced.bin"
          test -f "$REPORT"

          grep -Fq 'versionCode = 99' "$APP_GRADLE"

          grep -Fq 'versionName = "0.99"' "$APP_GRADLE"

          grep -Fq 'FLYBRAIN V0.99' "$MAIN"

          grep -Fq 'NEURONS = 16669' "$META"

          grep -Fq 'FBC99' "$MAIN"

          echo "========================================"
          echo "PROYECTO V0.99 VALIDADO"
          echo "========================================"

          echo "Version: 0.99"
          echo "VersionCode: 99"
          echo "Neuronas: 16.669"
          echo "Formato binario: FBC99"
          echo "MaleCNS: OK"
          echo "Functional bridge selection: OK"
          echo "VNC motor output: OK"
          echo "Descending roles: OK"
          echo "Neural diagnostic layer: OK"
          echo "Synaptic temporal traces: OK"


      # ============================================================
      # 15. COMPILAR APK
      # ============================================================

      - name: Compilar APK V0.99
        working-directory: proyecto
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPILANDO APK FLYBRAIN V0.99"
          echo "========================================"

          gradle --version

          gradle :app:assembleDebug --stacktrace --no-daemon

          echo "========================================"
          echo "COMPILACION FINALIZADA"
          echo "========================================"


      # ============================================================
      # 16. VERIFICAR APK
      # ============================================================

      - name: Verificar APK V0.99
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO APK V0.99"
          echo "========================================"

          APK="proyecto/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK ENCONTRADO:"
          ls -lh "$APK"

          echo "========================================"
          echo "APK V0.99 VERIFICADO CORRECTAMENTE"
          echo "========================================"


      # ============================================================
      # 17. SUBIR APK COMO ARTIFACT
      # ============================================================

      - name: Subir APK V0.99
        uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-V0.99-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
